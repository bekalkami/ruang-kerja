<html lang="id">
<head>

<title>Ruang Kerja Saya</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700&display=swap">
<style>
:root{--bg:#F2F5F7;--sf:#FFFFFF;--ink:#1B2430;--mut:#5E6B7A;--line:#D9E0E6;--ac:#1F6F8B;--acs:#DCEBF1;--warn:#9A6212;--bad:#B93A32;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10171E;--sf:#18222B;--ink:#E7EDF2;--mut:#9AA8B5;--line:#2A3743;--ac:#6BB8D2;--acs:#1E3340;--warn:#E3B04B;--bad:#F08A82;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10171E;--sf:#18222B;--ink:#E7EDF2;--mut:#9AA8B5;--line:#2A3743;--ac:#6BB8D2;--acs:#1E3340;--warn:#E3B04B;--bad:#F08A82;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.55 'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif}
.app{display:grid;grid-template-columns:210px minmax(0,1fr);max-width:1040px;margin:0 auto}
nav{position:sticky;top:0;align-self:start;padding:28px 14px;display:flex;flex-direction:column;gap:4px}
.brand{font-weight:700;font-size:18px;padding:0 12px 16px}
nav button{font:inherit;font-weight:500;color:var(--mut);background:none;border:0;border-left:3px solid transparent;border-radius:6px;text-align:left;padding:9px 12px;cursor:pointer}
nav button[aria-current="page"]{color:var(--ink);border-left-color:var(--ac);background:var(--acs)}
nav .tgl{margin-top:16px;font-size:13px}
main{padding:28px 24px 48px;min-width:0}
h1{font-size:26px;line-height:1.2;margin:0 0 2px}
h2{font-size:16px;margin:26px 0 8px}
.sub{color:var(--mut);margin:0 0 20px}
input,select,textarea{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
:is(input,select,textarea,button):focus-visible{outline:2px solid var(--ac);outline-offset:2px}
textarea{width:100%;resize:vertical}
.pri,.sec{font:inherit;font-weight:500;border-radius:8px;padding:8px 14px;cursor:pointer;border:1px solid var(--ac)}
.pri{background:var(--ac);color:var(--bg)}
.sec{background:none;color:var(--ac)}
.bad{border-color:var(--bad);color:var(--bad)}
.qa,.fm{display:flex;flex-wrap:wrap;gap:8px;background:var(--sf);border:1.5px solid var(--ac);border-radius:12px;padding:10px}
.fm{border:1px solid var(--line);border-radius:10px;margin-bottom:12px}
.qa input[name=x],.fm input[name=x]{flex:1 1 200px}
.box{background:var(--sf);border:1px solid var(--line);border-radius:10px;margin:0 0 8px}
.row{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line)}
.row:last-child{border:0}
.row input[type=checkbox]{width:18px;height:18px;accent-color:var(--ac);flex:none}
.tx{flex:1;min-width:0;overflow-wrap:anywhere}
.done .tx{text-decoration:line-through;color:var(--mut)}
.past .tx,.past .tm{color:var(--mut)}
.tm{width:48px;flex:none;color:var(--ink);font-variant-numeric:tabular-nums}
.chip{font-size:12px;padding:2px 9px;border-radius:99px;background:var(--acs);color:var(--ac);white-space:nowrap}
.late{background:none;color:var(--bad);border:1px solid var(--bad)}
.hi{background:none;color:var(--warn);border:1px solid var(--warn)}
.x{background:none;border:0;color:var(--mut);font-size:20px;line-height:1;padding:2px 6px;cursor:pointer}
.em{padding:14px 12px;color:var(--mut)}
.tabs{display:flex;gap:6px;margin:14px 0}
.tabs button{font:inherit;font-size:14px;background:none;color:var(--mut);border:1px solid var(--line);border-radius:99px;padding:4px 14px;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--ac);border-color:var(--ac);color:var(--bg)}
.bar{display:flex;gap:8px;margin-bottom:14px}
.bar input{flex:1}
.ng{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.nc{font:inherit;color:inherit;text-align:left;background:var(--sf);border:1px solid var(--line);border-radius:10px;padding:12px;cursor:pointer;min-height:90px}
.nc b{display:block;margin-bottom:4px;overflow-wrap:anywhere}
.nc p{margin:0;color:var(--mut);white-space:pre-wrap;overflow:hidden;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow-wrap:anywhere}
.ed{display:grid;gap:8px;background:var(--sf);border:1.5px solid var(--ac);border-radius:12px;padding:12px;margin-bottom:14px}
.ed .bt{display:flex;gap:8px}
.ed .bt .bad{margin-left:auto}
@media(max-width:720px){
.app{grid-template-columns:1fr}
nav{position:fixed;left:0;right:0;bottom:0;top:auto;flex-direction:row;gap:2px;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));background:var(--sf);border-top:1px solid var(--line);z-index:5}
nav button{flex:1;text-align:center;border-left:0;border-top:3px solid transparent;padding:8px 2px;font-size:13px}
nav button[aria-current="page"]{border-top-color:var(--ac)}
nav .tgl{margin:0}
.brand{display:none}
main{padding:20px 14px 96px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Pixelify+Sans:wght@400;500;700&display=swap">
<style>

.tk{border-bottom:2px solid var(--line)}.tk:last-child{border:0}

.kb{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;align-items:start}

.kd{background:var(--sf);border:3px solid #3B1F1A;padding:8px;margin-bottom:8px;display:grid;gap:6px;overflow-wrap:anywhere}.km{display:flex;gap:6px}.km .sec{padding:4px 12px;font-size:12px}
.cal{background:var(--sf);border:3px solid #3B1F1A;box-shadow:4px 4px 0 var(--sh);padding:10px;margin-bottom:12px}

.pm{padding:16px;display:grid;gap:10px;justify-items:start}.pt{font:400 38px 'Press Start 2P',monospace;color:#3B1F1A}.pm .bt{display:flex;gap:8px}.pm select{max-width:100%}
.hb{flex-wrap:wrap}.wk{display:flex;gap:4px}.hd{width:26px;height:26px;border:2px solid #3B1F1A;background:#FFFAF0;cursor:pointer;padding:0}.hd.on{background:#2F7D5B}
.st{display:block;font-size:15px;color:var(--mut)}
.bdg{min-height:70px;cursor:default}.bdg.lock{opacity:.45}
#tt{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:60;display:grid;gap:8px;pointer-events:none;width:max-content;max-width:90vw}
.to{background:#1A0F0F;color:#FFF4E0;font:400 10px/1.6 'Press Start 2P',monospace;padding:10px 14px;border:3px solid #FFF4E0}
@media(max-width:720px){.kb{grid-template-columns:1fr}nav button{font-size:8px;padding:8px 0}.pt{font-size:30px}}
.r2{display:flex;gap:8px;flex-wrap:wrap}.r2 input{flex:1 1 140px}
.ed label{display:flex;align-items:center;gap:8px}
.mdv{background:#FFFAF0;border:2px solid #3B1F1A;padding:8px 12px;min-height:120px;overflow-wrap:anywhere}.mdv h3{font:400 12px/1.6 'Press Start 2P',monospace;margin:8px 0}.mdv p{margin:4px 0}.ml{list-style:none;margin:4px 0;padding-left:4px}
.tg{display:block;color:var(--ac);font-size:15px;margin-top:6px}
.st7{display:flex;gap:6px;align-items:flex-end;padding:12px;height:150px}.dc{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px}.bs{display:flex;align-items:flex-end;gap:2px;flex:1;width:100%;justify-content:center}.bs i{display:block;width:30%;max-width:14px;min-height:2px;border:1px solid #3B1F1A}

#cp{position:fixed;inset:0;z-index:70;background:rgba(26,15,15,.55);display:flex;justify-content:center;align-items:flex-start;padding:12vh 16px}.cb{width:min(520px,100%);background:var(--sf);border:3px solid #3B1F1A;box-shadow:4px 4px 0 var(--sh);padding:12px;display:grid;gap:8px}
#cpl{list-style:none;margin:0;padding:0;display:grid;gap:4px;max-height:40vh;overflow:auto}#cpl button{width:100%;text-align:left;font:inherit;color:inherit;background:#FFFAF0;border:2px solid #3B1F1A;padding:8px 10px;cursor:pointer}#cpl button[aria-pressed='true']{background:#3B1F1A;color:#FFF4E0}

.ug{background:var(--bad);color:#FFF4E0;border-color:var(--bad)}

<style id="admin-css">
.adg{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-bottom:8px}
.adc{background:var(--sf);border:1px solid var(--line);border-radius:10px;padding:12px}

<body>
<i class="sun"></i><i class="cl c1"></i><i class="cl c2"></i>
<div id="st" role="dialog" aria-label="Layar mulai"><i class="sun"></i><i class="cl c1"></i><i class="cl c2"></i><div class="pill">MODE 8-BIT</div><div class="ttl">RUANG<br>KERJA</div><button id="go">TEKAN MULAI</button><div class="ground"></div></div>
<div class="app">
<nav aria-label="Menu utama">
<div class="brand">Ruang Kerja</div>
<button data-v="today">Beranda</button>
<button data-v="tasks">Tugas</button>
<button data-v="sched">Jadwal</button>
<button data-v="focus">Waktu</button>
<button data-v="notes">Catatan</button>
<button data-v="admin">Admin</button>
<button class="tgl" data-b="cpo">Perintah</button>
</nav>
<main id="main"></main>
</div>
<div class="ground pg"></div>
<script>
const $=s=>document.querySelector(s);
let S={tasks:[],events:[],notes:[],habits:[],dd:{},pd:{},xp:0,stat:{done:0,pom:0},badges:{},cats:[{id:'kerja',n:'Kerja',c:'#B5482F'},{id:'pribadi',n:'Pribadi',c:'#2F7D5B'},{id:'belajar',n:'Belajar',c:'#2D5DA8'}]},view='today',filter='aktif',q='',editNote=null,focusNew=false,pend=null,mode={tasks:'list',sched:'list'},fcat='',calM=new Date(new Date().getFullYear(),new Date().getMonth(),1),calSel=null;
try{const r=localStorage.getItem('wf1');if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
try{const t=localStorage.getItem('wf1t');if(t)document.documentElement.dataset.theme=t}catch(e){}
const save=()=>{try{localStorage.setItem('wf1',JSON.stringify(S))}catch(e){}};
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>{const d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const fmt=d=>new Date(d+'T00:00').toLocaleDateString('id-ID',{weekday:'short',day:'numeric',month:'short'});
const byTime=(a,b)=>((a.date||'')+(a.time||'99'))<((b.date||'')+(b.time||'99'))?-1:1;

return `<h2>Alarm</h2><form id='fal' class='fm'><input type='time' name='t' value='07:00' required aria-label='Jam alarm'><input name='l' placeholder='Label, misalnya Bangun' autocomplete='off' aria-label='Label'><div class='dy' role='group' aria-label='Ulangi pada hari'><span>Ulangi:</span>${[1,2,3,4,5,6,0].map(d=>`<label><input type='checkbox' name='d${d}'>${DN[d]}</label>`).join('')}</div><button class='pri'>Tambah alarm</button></form>
${box(L.map(a=>`<li class='row hb' style='list-style:none'><span class='pt' style='font-size:20px'>${esc(a.tm)}</span><span class='tx'>${esc(a.lb||'Alarm')}<small class='st'>${a.days.length?a.days.map(d=>DN[d]).join(', '):'Sekali'}${a.snz?', ditunda':''}</small></span><button class='sec' data-b='aon' data-i='${a.id}' aria-pressed='${!!a.on}'>${a.on?'Aktif':'Mati'}</button><button class='x' data-b='adl' data-i='${a.id}' aria-label='Hapus alarm'>\u00d7</button></li>`),'Belum ada alarm. Kosongkan pilihan hari untuk alarm sekali saja.')}
<h2>Notifikasi dan layar</h2><div class='box pm'><p class='sub' style='margin:0'>Alarm, timer, dan pengingat hanya berbunyi selama halaman ini terbuka. Status notifikasi browser: ${np==='granted'?'aktif':np==='denied'?'diblokir':np==='default'?'belum diizinkan':np}.</p><div class='bt' style='flex-wrap:wrap'><button class='sec' data-b='ntf'>Aktifkan notifikasi</button><button class='sec' data-b='wlk' aria-pressed='${!!wlOn}'>Jaga layar menyala: ${wlOn?'nyala':'mati'}</button><button class='sec' data-b='tst'>Uji alarm</button></div></div>`};
const vTimer=()=>`<h2>Timer mundur</h2><div class='box pm'><div class='pt' id='tmd' role='timer'>${mm(tmr.run?Math.max(0,Math.ceil((tmr.end-Date.now())/1000)):tmr.left)}</div><div class='bt' style='flex-wrap:wrap'>${[1,5,10,15,30].map(m=>`<button class='sec' data-b='tp' data-i='${m}'>${m} mnt</button>`).join('')}</div><form id='ftm' class='r2'><input type='number' name='m' min='1' max='600' placeholder='Menit lain' aria-label='Menit'><button class='sec'>Atur</button></form><div class='bt'><button class='pri' data-b='tgo'>${tmr.run?'Jeda':'Mulai'}</button><button class='sec' data-b='trs'>Ulang</button></div></div>
<h2>Stopwatch</h2><div class='box pm'><div class='pt' id='swd'>${mm2(swT())}</div><div class='bt'><button class='pri' data-b='sgo'>${sw.run?'Berhenti':'Mulai'}</button><button class='sec' data-b='slp'>Putaran</button><button class='sec' data-b='srs'>Ulang</button></div>${sw.laps.length?`<ol class='ml'>${sw.laps.map(l=>`<li>${mm2(l)}</li>`).join('')}</ol>`:''}</div>`;
const vWaktu=()=>`<h1>Waktu</h1><p class='sub'>Alarm, timer, dan fokus</p><div class='tabs'>${[['alarm','Alarm'],['timer','Timer'],['fokus','Fokus']].map(([k,n])=>`<button data-b='ft' data-i='${k}' aria-pressed='${ftab===k}'>${n}</button>`).join('')}</div>${ftab==='alarm'?vAlarm():ftab==='timer'?vTimer():vFocus()}`;
CM.push(['Alarm dan timer',()=>{ftab='alarm';go('focus')}]);
/* ===== PANEL ADMIN ===== */
let adTab='ring',adq='',adArm='';
const ADT=[['ring','Ringkasan'],['tugas','Tugas'],['jadwal','Jadwal'],['catatan','Catatan'],['habit','Kebiasaan'],['sistem','Sistem']];
const adDef=()=>({tasks:[],events:[],notes:[],habits:[],dd:{},pd:{},xp:0,stat:{done:0,pom:0},badges:{},cats:[{id:'kerja',n:'Kerja',c:'#B5482F'},{id:'pribadi',n:'Pribadi',c:'#2F7D5B'},{id:'belajar',n:'Belajar',c:'#2D5DA8'}]});
const adOk=k=>{if(adArm===k){adArm='';return true}adArm=k;toast('Klik sekali lagi untuk konfirmasi');setTimeout(()=>{if(adArm===k)adArm=''},4000);return false};
const adOp=(a,s)=>a.map(([v,n])=>`<option value='${v}'${String(s)===String(v)?' selected':''}>${esc(n)}</option>`).join('');
const adI=(k,id,f,v,l,ty,cl)=>`<input class='${cl||''}' type='${ty||'text'}' data-ad='${k}' data-id='${id}' data-f='${f}' value='${esc(v)}' aria-label='${l}'>`;
const adS=(k,id,f,v,l,o)=>`<select data-ad='${k}' data-id='${id}' data-f='${f}' aria-label='${l}'>${adOp(o,v)}</select>`;
const adD=(k,id,l)=>`<button class='x' data-adb='del' data-k='${k}' data-id='${id}' aria-label='Hapus ${l}'>\u00d7</button>`;
const adF=(l,fn)=>l.filter(x=>!adq||fn(x).toLowerCase().includes(adq.toLowerCase()));
const adRows={
tugas:()=>adF(S.tasks,t=>t.t||'').map(t=>`<li class='adr'>${adI('tk',t.id,'t',t.t,'Judul tugas','text','w')}${adS('tk',t.id,'status',stt(t),'Status',KC)}${adS('tk',t.id,'pl',plv(t),'Prioritas',PL.map((n,i)=>[i,n||'Tanpa prioritas']))}${adI('tk',t.id,'due',t.due||'','Batas waktu','date')}${adS('tk',t.id,'cat',t.cat||'','Kategori',[['','Tanpa kategori'],...S.cats.map(c=>[c.id,c.n])])}${adS('tk',t.id,'rep',t.rep||'','Ulangi',[['','Sekali'],...Object.entries(RP)])}${adD('tk',t.id,'tugas')}</li>`),
jadwal:()=>adF(S.events,e=>e.t||'').sort(byTime).map(e=>`<li class='adr'>${adI('ev',e.id,'t',e.t,'Judul jadwal','text','w')}${adI('ev',e.id,'date',e.date||'','Tanggal','date')}${adI('ev',e.id,'time',e.time||'','Jam','time')}${adS('ev',e.id,'rem',e.rem>=0?e.rem:'','Pengingat',[['','Tanpa pengingat'],[0,'Saat mulai'],[5,'5 mnt'],[10,'10 mnt'],[15,'15 mnt'],[30,'30 mnt'],[60,'1 jam']])}${adD('ev',e.id,'jadwal')}</li>`),
catatan:()=>adF(S.notes,n=>(n.title||'')+' '+(n.body||'')).map(n=>`<li class='adr'>${adI('nt',n.id,'title',n.title||'','Judul catatan','text','w')}${adD('nt',n.id,'catatan')}<textarea class='fw' rows='3' data-ad='nt' data-id='${n.id}' data-f='body' aria-label='Isi catatan'>${esc(n.body)}</textarea></li>`),
habit:()=>adF(S.habits,h=>h.t||'').map(h=>`<li class='adr'>${adI('hb',h.id,'t',h.t,'Nama kebiasaan','text','w')}<span class='chip'>Streak ${streak(h)} hari</span><span class='chip'>${Object.keys(h.log||{}).length} hari tercatat</span>${adD('hb',h.id,'kebiasaan')}</li>`)
};
const adNew={tugas:()=>S.tasks.unshift({id:uid(),t:'Tugas baru',done:0,status:'todo',due:'',pri:0}),jadwal:()=>S.events.push({id:uid(),t:'Jadwal baru',date:today(),time:''}),catatan:()=>S.notes.unshift({id:uid(),title:'Catatan baru',body:'',ts:Date.now()}),habit:()=>S.habits.push({id:uid(),t:'Kebiasaan baru',log:{}})};
const adList=()=>box(adRows[adTab](),adq?'Tidak ada yang cocok dengan pencarian.':'Belum ada data.');
const vAdList=()=>{const bulk={tugas:['done','Hapus yang selesai'],jadwal:['past','Hapus yang sudah lewat'],catatan:['empty','Hapus catatan kosong']}[adTab];
return `<div class='bar'><input id='adq' type='search' placeholder='Cari\u2026' value='${esc(adq)}' aria-label='Cari data'><button class='pri' data-adb='add'>+ Tambah</button></div><div id='adl'>${adList()}</div><div class='adbt'>${bulk?`<button class='sec bad' data-adb='clr' data-k='${bulk[0]}'>${bulk[1]}</button>`:''}<button class='sec bad' data-adb='clr' data-k='all'>Hapus semua</button></div>`};
const vAdRing=()=>{const t=today(),A=S.tasks,late=A.filter(x=>!x.done&&x.due&&x.due<t).length;
return `<div class='adg'>${[[A.length,'Total tugas'],[A.filter(x=>!x.done).length,'Tugas aktif'],[late,'Terlambat'],[S.events.length,'Jadwal'],[S.events.filter(e=>e.date===t).length,'Jadwal hari ini'],[S.notes.length,'Catatan'],[S.habits.length,'Kebiasaan'],[AL().length,'Alarm'],['LV '+lv(),S.xp+' XP'],[(JSON.stringify(S).length/1024).toFixed(1)+' KB','Ukuran data']].map(([n,l])=>`<div class='adc'><b>${n}</b><small>${l}</small></div>`).join('')}</div>${vStats()}`};
const vAdSis=()=>`<h2>Kontrol</h2><div class='adp'><label>XP <input type='number' id='adxp' min='0' value='${S.xp}' aria-label='Nilai XP'></label><button class='sec' data-adb='xp'>Atur XP</button><button class='sec' data-adb='snd'>Suara: ${S.snd===0?'mati':'nyala'}</button><button class='sec' data-a='th'>Ganti tema</button></div>
<h2>Kategori</h2>${box(S.cats.map(c=>`<li class='adr'>${adI('ct',c.id,'c',c.c,'Warna','color','clr')}${adI('ct',c.id,'n',c.n,'Nama kategori','text','w')}${adD('ct',c.id,'kategori')}</li>`),'Belum ada kategori.')}<div class='bar'><input id='adcn' placeholder='Kategori baru' aria-label='Kategori baru'><button class='sec' data-adb='addc'>Tambah</button></div>
<h2>Alarm</h2>${box(AL().map(a=>`<li class='adr'>${adI('al',a.id,'tm',a.tm,'Jam','time')}${adI('al',a.id,'lb',a.lb||'','Label','text','w')}${adS('al',a.id,'on',a.on?1:0,'Status',[[1,'Aktif'],[0,'Mati']])}${adD('al',a.id,'alarm')}</li>`),'Belum ada alarm.')}
<h2>Lencana</h2><div class='adp'>${BD.map(([id,n])=>`<button class='sec' data-adb='bd' data-id='${id}' aria-pressed='${!!S.badges[id]}'>${S.badges[id]?'\u2713 ':''}${esc(n)}</button>`).join('')}</div>
<h2>Editor data mentah (JSON)</h2><div class='adp'><textarea id='adj' rows='10' spellcheck='false' aria-label='Data JSON'>${esc(JSON.stringify(S,null,1))}</textarea><div class='adbt'><button class='pri' data-adb='aj'>Validasi dan terapkan</button><button class='sec' data-adb='dl'>Unduh cadangan</button><label class='sec adf'>Impor file<input type='file' id='adf' accept='.json,application/json' hidden></label></div></div>
<h2>Zona berbahaya</h2><div class='adp'><button class='sec bad' data-adb='rs'>Reset statistik dan XP</button><button class='sec bad' data-adb='rb'>Reset lencana</button><button class='sec bad' data-adb='ra'>Hapus semua data</button></div>`;
const vAdmin=()=>`<h1>Admin</h1><p class='sub'>Kontrol dan edit seluruh data. Perubahan tersimpan otomatis di browser ini.</p><div class='tabs' role='group' aria-label='Bagian admin'>${ADT.map(([k,n])=>`<button data-adb='tab' data-id='${k}' aria-pressed='${adTab===k}'>${n}</button>`).join('')}</div>${adTab==='ring'?vAdRing():adTab==='sistem'?vAdSis():vAdList()}`;
document.addEventListener('input',e=>{if(e.target.id==='adq'){adq=e.target.value;const l=$('#adl');if(l)l.innerHTML=adList()}});
document.addEventListener('change',e=>{const el=e.target;
if(el.id==='adf'){const f=el.files[0];if(f){const r=new FileReader();r.onload=()=>{$('#adj').value=r.result;toast('File dimuat ke editor. Klik Validasi dan terapkan.')};r.readAsText(f)}return}
const k=el.dataset&&el.dataset.ad;if(!k)return;
const o=({tk:S.tasks,ev:S.events,nt:S.notes,hb:S.habits,ct:S.cats,al:AL()})[k].find(x=>x.id===el.dataset.id),f=el.dataset.f,v=el.value;if(!o)return;
if(k==='tk'){if(f==='t')o.t=v.trim()||o.t;else if(f==='status'){o.status=v;o.done=v==='done'?1:0;if(o.done)o.xpd=1}else if(f==='pl'){o.pl=+v;o.pri=+v>=3?1:0}else o[f]=v}
else if(k==='ev'){if(f==='rem'){if(v==='')delete o.rem;else o.rem=+v}else o[f]=f==='t'?(v.trim()||o.t):v;o.fired=0}
else if(k==='nt')o[f]=f==='title'?(v.trim()||'Tanpa judul'):v;
else if(k==='hb')o.t=v.trim()||o.t;
else if(k==='ct'){if(f==='n')o.n=v.trim()||o.n;else o.c=v}
else if(k==='al'){if(f==='on')o.on=+v;else if(f==='tm'){o.tm=v||o.tm;o.last='';o.snz=0}else o.lb=v.trim()}
save();toast('Tersimpan');if(el.tagName==='SELECT')render()});
document.addEventListener('click',e=>{const b=e.target.closest('[data-adb]');if(!b)return;const a=b.dataset.adb,id=b.dataset.id,k=b.dataset.k;
if(a==='tab'){adTab=id;adq='';render();return}
if(a==='del'){const m={tk:'tasks',ev:'events',nt:'notes',hb:'habits',ct:'cats'}[k];if(m)S[m]=S[m].filter(x=>x.id!==id);else S.alarms=AL().filter(x=>x.id!==id)}
else if(a==='add')adNew[adTab]();
else if(a==='clr'){if(!adOk('c'+adTab+k))return;
 if(k==='all')({tugas:()=>S.tasks=[],jadwal:()=>S.events=[],catatan:()=>S.notes=[],habit:()=>S.habits=[]})[adTab]();
 else if(k==='done')S.tasks=S.tasks.filter(t=>!t.done);
 else if(k==='past')S.events=S.events.filter(x=>x.date>=today());
 else if(k==='empty')S.notes=S.notes.filter(n=>(n.body||'').trim());
 toast('Data dihapus')}
else if(a==='xp')S.xp=Math.max(0,parseInt($('#adxp').value,10)||0);
else if(a==='snd')S.snd=S.snd===0?1:0;
else if(a==='addc'){const v=$('#adcn').value.trim();if(!v){toast('Isi nama kategori');return}S.cats.push({id:uid(),n:v,c:CP[S.cats.length%CP.length]})}
else if(a==='bd'){if(S.badges[id])delete S.badges[id];else S.badges[id]=Date.now()}
else if(a==='dl'){const u=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:'application/json'})),l=document.createElement('a');l.href=u;l.download='ruang-kerja-cadangan-'+today()+'.json';l.click();setTimeout(()=>URL.revokeObjectURL(u),1000);return}
else if(a==='aj'){try{const p=JSON.parse($('#adj').value);if(!p||typeof p!=='object'||Array.isArray(p))throw 0;['tasks','events','notes','habits'].forEach(x=>{if(!Array.isArray(p[x]))throw 0});if(!adOk('aj'))return;S=Object.assign(adDef(),p);toast('Data diterapkan')}catch(x){toast('JSON tidak valid atau struktur tidak lengkap');return}}
else if(a==='rs'){if(!adOk('rs'))return;S.xp=0;S.stat={done:0,pom:0};S.dd={};S.pd={};toast('Statistik direset')}
else if(a==='rb'){if(!adOk('rb'))return;S.badges={};toast('Lencana direset')}
else if(a==='ra'){if(!adOk('ra'))return;S=adDef();toast('Semua data dihapus')}
save();render()});
CM.push(['Buka Admin',()=>go('admin')]);
route();
(()=>{const st=$('#st');let seen=null;try{seen=sessionStorage.getItem('wf1s')}catch(e){}
if(seen){st.remove();return}
const go=()=>{st.remove();try{sessionStorage.setItem('wf1s','1')}catch(e){}};
$('#go').addEventListener('click',go);
addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' ')go()});
$('#go').focus();
})();
</script>
</body>
</html>
